name: Build and Publish AfxHookSource2

on:
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          check-latest: true
      - uses: MinoruSekine/setup-scoop@v4

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install gettext
        run: scoop install gettext

      - name: CMake - Configure Source2
        working-directory: "${{github.workspace}}"
        run: |
          $diagnostics = "OFF"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $diagnostics = "ON"
          }
          cmake --preset x64-release "-DAFX_MIRV_POV_DIAGNOSTICS=$diagnostics"

      - name: CMake - Build Source2
        working-directory: "${{github.workspace}}"
        run: cmake --build --preset x64-release --target AfxHookSource2

      - name: CMake - Install Source2
        working-directory: "${{github.workspace}}"
        run: |
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-runtime
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-source2

      - name: Prepare licensed binary and corresponding source
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "build/staging-release"
          $release = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          $source = $null
          $candidates = @(
            "bin/x64/AfxHookSource2.dll",
            "x64/AfxHookSource2.dll"
          )
          foreach ($candidate in $candidates) {
            $candidatePath = Join-Path $staging $candidate
            if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
              $source = $candidatePath
              break
            }
          }

          if ($null -eq $source) {
            throw "Could not find AfxHookSource2.dll in $staging. Checked: $($candidates -join ', ')"
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $binaryRoot = Join-Path $env:RUNNER_TEMP "AfxHookSource2-$shortSha-windows-x64"
          New-Item -ItemType Directory -Force -Path $binaryRoot | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $binaryRoot "AfxHookSource2.dll")
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $binaryRoot
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "NOTICE.md") -Destination $binaryRoot
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSES") -Destination $binaryRoot -Recurse
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "AfxHookSource2/MIRV_POV_LICENSE.md") -Destination $binaryRoot

          $thirdPartyRoot = Join-Path $binaryRoot "THIRD_PARTY_LICENSES"
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "deps/release") -Recurse -File |
            Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)(\.|$)' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.FullName)
              $destination = Join-Path $thirdPartyRoot $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination
            }

          $binaryArchive = Join-Path $release "AfxHookSource2-$shortSha-windows-x64.zip"
          Compress-Archive -Path (Join-Path $binaryRoot "*") -DestinationPath $binaryArchive

          $sourceRoot = Join-Path $env:RUNNER_TEMP "AfxHookSource2-$shortSha-source"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          git ls-files --recurse-submodules | ForEach-Object {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path -LiteralPath $sourcePath -PathType Leaf) {
              $destination = Join-Path $sourceRoot $_
              New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
              Copy-Item -LiteralPath $sourcePath -Destination $destination
            }
          }
          @(
            "Repository commit: $env:GITHUB_SHA"
            ""
            "Submodules:"
            (git submodule status --recursive)
          ) | Set-Content -LiteralPath (Join-Path $sourceRoot "SOURCE-COMMIT.txt") -Encoding utf8

          $sourceArchive = Join-Path $release "AfxHookSource2-$shortSha-source.zip"
          Compress-Archive -Path (Join-Path $sourceRoot "*") -DestinationPath $sourceArchive

      - name: Upload licensed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30

  publish_prerelease:
    name: Publish DLL prerelease
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download licensed release assets
        uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: prerelease-${{ github.run_number }}-${{ github.sha }}
          RELEASE_TITLE: AfxHookSource2 prerelease ${{ github.sha }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          binary_archive="AfxHookSource2-${short_sha}-windows-x64.zip"
          source_archive="AfxHookSource2-${short_sha}-source.zip"
          commit_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message')"
          notes_file="${RUNNER_TEMP}/prerelease-notes.md"

          {
            printf '## Download\n\n'
            printf 'Download `%s`, extract it, and use the `AfxHookSource2.dll` file inside.\n\n' "$binary_archive"
            printf '## Commit\n\n'
            printf '[`%s`](https://github.com/%s/commit/%s)\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '### Commit message\n\n'
            printf '%s\n' "$commit_message" | sed 's/^/> /'
            printf '\n\n## Corresponding source\n\n'
            printf 'Download `%s` from this release for the complete corresponding source. ' "$source_archive"
            printf 'This AfxHookSource2 binary includes the AGPL-3.0-only mirv_pov feature; '
            printf 'separate AdvancedFX and third-party source retains its original license.\n'
          } > "$notes_file"

          gh release create "$RELEASE_TAG" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$notes_file" \
            --prerelease \
            --latest=false \
            --generate-notes

  publish_release:
    name: Publish DLL release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download licensed release assets
        uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_LICENSE_NOTICE: This AfxHookSource2 binary includes the AGPL-3.0-only mirv_pov feature. Download the matching source archive beside the binary archive for the complete corresponding source; separate AdvancedFX and third-party source retains its original license.
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest=true
          else
            gh release create "$RELEASE_TAG" release/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AfxHookSource2 $RELEASE_TAG" \
              --notes "$RELEASE_LICENSE_NOTICE" \
              --verify-tag \
              --latest=true \
              --generate-notes
          fi
