name: Build and Publish AfxHookSource2

on:
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          check-latest: true
      - uses: MinoruSekine/setup-scoop@v4

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install gettext
        run: scoop install gettext

      - name: CMake - Configure Source2
        working-directory: "${{github.workspace}}"
        run: cmake --preset x64-release

      - name: CMake - Build Source2
        working-directory: "${{github.workspace}}"
        run: cmake --build --preset x64-release --target AfxHookSource2

      - name: CMake - Install Source2
        working-directory: "${{github.workspace}}"
        run: |
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-runtime
          cmake --install build/x64-release --config Release --prefix build/staging-release --component x64-source2

      - name: Prepare AfxHookSource2.dll
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "build/staging-release"
          $release = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          $source = $null
          $candidates = @(
            "bin/x64/AfxHookSource2.dll",
            "x64/AfxHookSource2.dll"
          )
          foreach ($candidate in $candidates) {
            $candidatePath = Join-Path $staging $candidate
            if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
              $source = $candidatePath
              break
            }
          }

          if ($null -eq $source) {
            throw "Could not find AfxHookSource2.dll in $staging. Checked: $($candidates -join ', ')"
          }
          Copy-Item -LiteralPath $source -Destination (Join-Path $release "AfxHookSource2.dll")

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish DLL release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DLL assets
        uses: actions/download-artifact@v4
        with:
          name: AfxHookSource2-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/AfxHookSource2.dll --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/AfxHookSource2.dll \
              --repo "$GITHUB_REPOSITORY" \
              --title "AfxHookSource2 $RELEASE_TAG" \
              --generate-notes
          fi
